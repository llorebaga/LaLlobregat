name: Sincronitza el calendari

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: calendar-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descarrega el codi
        uses: actions/checkout@v4
      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Llegeix el calendari i actualitza el mapa
        run: node scripts/sync-calendar.mjs
      - name: Desa les actuacions noves
        id: update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- app/calendar-events.generated.json app/calendar-history.generated.json scripts/calendar-geocode-cache.json; then
            echo "El calendari no ha canviat."
            if [ "$(date -u +%H)" = "04" ]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          else
            git add app/calendar-events.generated.json app/calendar-history.generated.json scripts/calendar-geocode-cache.json
            git commit -m "Actualitza les actuacions del calendari"
          fi

          git push
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Publica els canvis al web
        if: steps.update.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "$GITHUB_REPOSITORY"
