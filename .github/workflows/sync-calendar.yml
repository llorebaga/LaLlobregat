name: Sincronitza el calendari

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descarrega el codi
        uses: actions/checkout@v4
      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Llegeix el calendari i actualitza el mapa
        run: node scripts/sync-calendar.mjs
      - name: Desa les actuacions noves
        run: |
          if git diff --quiet -- app/calendar-events.generated.json scripts/calendar-geocode-cache.json; then
            echo "El calendari no ha canviat."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/calendar-events.generated.json scripts/calendar-geocode-cache.json
          git commit -m "Actualitza les actuacions del calendari"
          git push
