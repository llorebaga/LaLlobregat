name: Publica el web a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descarrega el codi
        uses: actions/checkout@v4
      - name: Prepara pnpm
        uses: pnpm/action-setup@v4
      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instal·la les dependències
        run: pnpm install --frozen-lockfile
      - name: Construeix el web
        run: pnpm run build
        env:
          NEXT_PUBLIC_GOOGLE_CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaqueta el web
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publica a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
